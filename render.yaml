# Render blueprint for the Custody API.
#
# The service provisions itself on start: if the schema is absent, no cases
# are present, or the generated evidence file is missing, it loads the schema
# and seeds before accepting traffic. No shell access is required, which the
# free plan does not provide. Set AUTO_PROVISION=false to disable.
#
# Demonstrations should run against a local database. This deployment exists
# to share the dashboard and the reports.
#
services:
  - type: web
    name: custody-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: custody-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      # Set to false to disable provisioning on start.
      # - key: AUTO_PROVISION
      #   value: "false"
      # Left unset so the service uses the evidence pack vendored in this
      # repository at ./testdata.
      # - key: EVIDENCE_ROOT

databases:
  - name: custody-db
    plan: free
    databaseName: custody
    user: custody
